<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="description" content="Documentación del nuevo sitio web de Grupo Branding.">
  <link rel="canonical" href="https://menciajoel.github.io/grupo-branding-blueprint/">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%2328302c'/%3E%3Ctext x='32' y='42' text-anchor='middle' font-family='Arial,sans-serif' font-size='27' font-weight='700' fill='white'%3EGB%3C/text%3E%3C/svg%3E">
  <title>Grupo Branding · Documentación del nuevo sitio web</title>
  <style>
    :root{color-scheme:light;--paper:#f4f3ef;--panel:#faf9f6;--ink:#161a18;--muted:#626862;--line:#c7cbc4;--accent:#2b6670}
    *{box-sizing:border-box}
    html{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--paper);color:var(--ink)}
    body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:24px;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:24px 24px}
    main{width:min(100%,760px);border:1px solid var(--line);background:var(--panel);padding:clamp(28px,6vw,64px);box-shadow:0 16px 42px rgba(22,26,24,.07)}
    .eyebrow{margin:0 0 40px;color:var(--muted);font:700 12px/1.5 ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:.08em}
    h1{margin:0;font-size:clamp(22px,3vw,30px);letter-spacing:-.03em}
    h2{max-width:15ch;margin:20px 0 36px;font-size:clamp(36px,7vw,64px);line-height:1.08;letter-spacing:-.055em}
    a{display:inline-flex;align-items:center;justify-content:space-between;gap:28px;min-height:52px;max-width:100%;padding:14px 18px;background:#28302c;color:white;text-decoration:none;font-weight:650;line-height:1.4}
    a:hover{background:#1c514f}
    a:focus-visible{outline:3px solid var(--accent);outline-offset:4px}
    .arrow{font-size:22px;line-height:1}
    .meta{margin:42px 0 0;padding-top:16px;border-top:1px solid var(--line);color:var(--muted);font:11px/1.5 ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:.05em}
    @media(max-width:420px){body{padding:12px}main{padding:28px 22px}.eyebrow{margin-bottom:32px}h2{margin-bottom:30px}a{width:100%}}
    @media print{html,body{background:white}body{display:block;min-height:0}main{border:0;box-shadow:none;padding:0;width:100%}a{border:1px solid var(--ink);background:white;color:var(--ink)}}
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">DOCUMENTACIÓN · PREPRODUCCIÓN</p>
    <h1>Grupo Branding</h1>
    <h2>Documentación del nuevo sitio web</h2>
    <a href="./docs/arq.html">Consultar arquitectura y contenidos <span class="arrow" aria-hidden="true">→</span></a>
    <p class="meta">ARQ-02 · COPY-03</p>
  </main>
</body>
</html>
